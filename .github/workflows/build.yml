name: APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip Metin2Hesap.zip
      - run: cd Metin2Hesap && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Metin2Hesap-apk
          path: Metin2Hesap/app/build/outputs/apk/debug/app-debug.apk
